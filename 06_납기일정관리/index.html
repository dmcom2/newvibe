<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>납기일정 관리 | PCB 제조</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <h1>📅 납기일정 관리 <span style="font-size:.8rem;opacity:.7;font-weight:400;"> — PCB Manufacturing</span></h1>
  <button class="btn btn-report" onclick="openReport()">🖨 보고서 출력</button>
  <button class="btn btn-ghost" onclick="exportCSV()">📥 저장</button>
  <button class="btn btn-white" onclick="openModal()">+ 납기 등록</button>
</div>

<!-- 미션 1: D-3 납기 임박 경보 배너 -->
<div class="urgent-banner" id="urgentBanner" style="display:none;"></div>

<div class="filter-bar">
  <select id="customerFilter" onchange="render()">
    <option value="">전체 고객사</option>
  </select>
  <select id="statusFilter" onchange="render()">
    <option value="">전체 상태</option>
    <option value="scheduled">예정</option>
    <option value="progress">진행중</option>
    <option value="delay">지연우려</option>
    <option value="done">납기완료</option>
    <option value="late">납기지연</option>
  </select>
  <div class="tab-row" style="margin-left:auto;background:transparent;border:none;">
    <button class="tab-btn active" id="t-cal" onclick="switchTab('cal')">📅 캘린더</button>
    <button class="tab-btn" id="t-list" onclick="switchTab('list')">📋 목록</button>
    <button class="tab-btn" id="t-stat" onclick="switchTab('stat')">📊 통계</button>
  </div>
</div>

<div class="layout">
  <div class="kpi-row" id="kpiRow"></div>
  <div id="calView"></div>
  <div id="listView" style="display:none"></div>
  <div id="statView" style="display:none"></div>
</div>

<!-- 모달 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modalTitle">납기 등록</h2>
    <div class="form-row">
      <div class="form-group"><label>고객사</label><input id="d-customer" placeholder="(주)삼성전자"></div>
      <div class="form-group"><label>수주번호</label><input id="d-poNo" placeholder="PO-2026-001"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>제품명</label><input id="d-product" placeholder="PCB-A2401"></div>
      <div class="form-group"><label>수량 (매)</label><input type="number" id="d-qty" placeholder="1000"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>수주일</label><input type="date" id="d-orderDate"></div>
      <div class="form-group"><label>납기일</label><input type="date" id="d-dueDate"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>진행 상태</label>
        <select id="d-status">
          <option value="scheduled">예정</option><option value="progress">진행중</option>
          <option value="delay">지연우려</option><option value="done">납기완료</option><option value="late">납기지연</option>
        </select>
      </div>
      <div class="form-group"><label>실제 납기일</label><input type="date" id="d-actualDate" placeholder="납기완료시 입력"></div>
    </div>
    <div class="form-group"><label>담당자</label><input id="d-manager" placeholder="김영업"></div>
    <div class="form-group"><label>비고</label><textarea id="d-note"></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-red" id="delBtn" style="display:none" onclick="deleteItem()">삭제</button>
      <button class="btn btn-outline" onclick="closeModal()">취소</button>
      <button class="btn btn-blue" onclick="saveItem()">저장</button>
    </div>
  </div>
</div>

<div class="rpt-overlay" id="rptOverlay">
  <div class="rpt-toolbar">
    <span style="color:#fff;font-weight:700;font-size:.95rem">📅 납기일정 현황 보고서</span>
    <div style="display:flex;gap:8px">
      <button class="btn btn-white" onclick="window.print()">🖨 인쇄/PDF</button>
      <button class="btn btn-ghost" onclick="closeReport()">✕ 닫기</button>
    </div>
  </div>
  <div class="rpt-page" id="rptPage"></div>
</div>
<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>

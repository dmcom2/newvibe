<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>품질 성적서 관리 | PCB 제조</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f0f4f8;--surface:#fff;--border:#d1d9e0;
  --text:#1a202c;--sub:#4a5568;--mute:#a0aec0;
  --blue:#2563eb;--green:#059669;--amber:#d97706;--red:#dc2626;--teal:#0d9488;
  --rad:10px;--shadow:0 1px 3px rgba(0,0,0,.1),0 2px 8px rgba(0,0,0,.06);
}
body{font-family:'맑은 고딕','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.header{background:linear-gradient(135deg,#052e16,#059669);color:#fff;padding:0 28px;height:58px;display:flex;align-items:center;gap:12px;}
.header h1{font-size:1rem;font-weight:700;flex:1;}
.btn{padding:7px 16px;border:none;border-radius:7px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;}
.btn-white{background:#fff;color:var(--teal);}
.btn-ghost{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);}
.btn-blue{background:var(--blue);color:#fff;}
.btn-green{background:var(--green);color:#fff;}
.btn-outline{background:transparent;color:var(--sub);border:1px solid var(--border);}
.btn-red{background:var(--red);color:#fff;}
.btn-white:hover{background:#f0fdf4;}
.btn-ghost:hover{background:rgba(255,255,255,.25);}
.btn-blue:hover{background:#1d4ed8;}
.btn-green:hover{background:#047857;}
.btn-red:hover{background:#b91c1c;}
.btn-outline:hover{background:var(--bg);}
.header{box-shadow:0 2px 10px rgba(0,0,0,.2);}
.filter-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.filter-bar input,.filter-bar select{padding:6px 10px;border:1px solid var(--border);border-radius:7px;font-size:.82rem;font-family:inherit;outline:none;}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--teal);}
.layout{padding:18px 28px;display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start;}
.card-list{background:var(--surface);border-radius:var(--rad);box-shadow:var(--shadow);overflow:hidden;}
.list-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.list-header span{font-size:.85rem;font-weight:700;}
.cert-item{padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
.cert-item:hover{background:#fafbfc;}
.cert-item.selected{background:#f0fdf4;border-left:3px solid var(--green);}
.ci-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.ci-no{font-size:.72rem;font-family:monospace;color:var(--mute);}
.ci-product{font-size:.88rem;font-weight:700;}
.ci-customer{font-size:.75rem;color:var(--sub);}
.ci-meta{display:flex;gap:8px;margin-top:4px;font-size:.72rem;color:var(--mute);}
.pass-badge{padding:3px 8px;border-radius:12px;font-size:.72rem;font-weight:800;}
.cert-panel{background:var(--surface);border-radius:var(--rad);box-shadow:var(--shadow);}
.panel-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.panel-title{font-size:.9rem;font-weight:700;}
.cert-doc{padding:24px;}
.doc-title{text-align:center;margin-bottom:24px;}
.doc-title h2{font-size:1.2rem;font-weight:900;letter-spacing:2px;margin-bottom:4px;}
.doc-title p{font-size:.8rem;color:var(--sub);}
.doc-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--border);border-bottom:none;margin-bottom:16px;}
.di-row{display:grid;grid-template-columns:130px 1fr;border-bottom:1px solid var(--border);}
.di-label{padding:7px 10px;background:var(--bg);font-size:.75rem;font-weight:700;color:var(--sub);border-right:1px solid var(--border);}
.di-value{padding:7px 10px;font-size:.78rem;}
.section-title{font-size:.82rem;font-weight:800;color:var(--sub);margin:14px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--teal);}
.inspect-table{width:100%;border-collapse:collapse;font-size:.78rem;margin-bottom:10px;}
.inspect-table th{background:var(--bg);padding:8px 10px;text-align:center;border:1px solid var(--border);font-size:.72rem;font-weight:700;color:var(--sub);}
.inspect-table td{padding:8px 10px;border:1px solid var(--border);text-align:center;}
.result-ok{color:var(--green);font-weight:800;}
.result-ng{color:var(--red);font-weight:800;}
.final-result{margin-top:16px;text-align:center;padding:14px;border:2px solid;border-radius:8px;}
.sign-row{display:flex;justify-content:flex-end;gap:40px;margin-top:20px;font-size:.78rem;}
.sign-box{text-align:center;border-top:1px solid var(--border);padding-top:6px;min-width:80px;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface);border-radius:14px;padding:24px;width:700px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.2);}
.modal h2{font-size:.95rem;font-weight:800;margin-bottom:14px;}
.form-group{margin-bottom:10px;}
.form-group label{display:block;font-size:.75rem;font-weight:700;color:var(--sub);margin-bottom:3px;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:.85rem;outline:none;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
.inspect-input-table{width:100%;border-collapse:collapse;font-size:.78rem;margin-bottom:8px;}
.inspect-input-table th{background:var(--bg);padding:7px 8px;text-align:center;border:1px solid var(--border);font-size:.7rem;}
.inspect-input-table td{padding:5px;border:1px solid var(--border);}
.inspect-input-table input,.inspect-input-table select{width:100%;padding:4px 6px;border:1px solid var(--border);border-radius:4px;font-size:.75rem;}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:100%;background:transparent;}
.kpi{background:var(--surface);border-radius:var(--rad);padding:14px 16px;box-shadow:var(--shadow);border-left:4px solid transparent;}
.kpi-l{font-size:.72rem;color:var(--mute);margin-bottom:4px;}
.kpi-v{font-size:1.4rem;font-weight:900;}
.kpi-sub{font-size:.72rem;color:var(--mute);margin-top:3px;}
.monthly-trend-wrap{background:var(--surface);border-radius:var(--rad);padding:16px;box-shadow:var(--shadow);margin-top:14px;}
.mt-title{font-size:.85rem;font-weight:700;margin-bottom:12px;}
.mt-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:.78rem;}
.mt-month{width:65px;color:var(--sub);font-weight:700;}
.mt-bar{flex:1;height:14px;background:#e2e8f0;border-radius:4px;overflow:hidden;}
.mt-fill{height:100%;border-radius:4px;transition:width .4s;}
.mt-pct{width:42px;text-align:right;font-weight:700;font-size:.75rem;}
.fail-banner{background:linear-gradient(90deg,#7c2d12,#dc2626);color:#fff;padding:10px 28px;font-size:.85rem;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);background:#1e293b;color:#f1f5f9;padding:10px 22px;border-radius:30px;font-size:.85rem;opacity:0;transition:all .3s;pointer-events:none;z-index:500;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.25);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.btn-report{background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.4);}.btn-report:hover{background:rgba(255,255,255,.32);}
.rpt-overlay{display:none;position:fixed;inset:0;z-index:200;background:#6b7280;overflow-y:auto;}.rpt-overlay.show{display:block;}
.rpt-toolbar{position:sticky;top:0;z-index:10;background:#374151;padding:10px 28px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.3);}
.rpt-page{width:210mm;min-height:297mm;margin:20px auto;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.25);padding:18mm 16mm 18mm 20mm;font-family:'맑은 고딕','Malgun Gothic','Segoe UI',sans-serif;font-size:9pt;color:#111;line-height:1.5;}
.rpt-company{text-align:right;font-size:8pt;color:#555;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:14px;}.rpt-company strong{font-size:10pt;color:#111;}
.rpt-doc-title{text-align:center;margin-bottom:16px;}.rpt-doc-title h1{font-size:16pt;font-weight:900;letter-spacing:2px;color:#111;margin-bottom:4px;}.rpt-doc-title p{font-size:9pt;color:#555;}
.rpt-info-box{border:1px solid #bbb;border-collapse:collapse;width:100%;margin-bottom:16px;}.rpt-info-box td{border:1px solid #bbb;padding:5px 10px;font-size:8.5pt;}.rpt-info-box .rpt-label{background:#f5f5f5;font-weight:700;width:80px;color:#333;}
.rpt-sec{margin-bottom:14px;}.rpt-sec-title{font-size:10pt;font-weight:900;background:#1e3a5f;color:#fff;padding:5px 10px;margin-bottom:8px;letter-spacing:.5px;}
.rpt-table{width:100%;border-collapse:collapse;font-size:8.5pt;margin-bottom:4px;}.rpt-table th{background:#1e3a5f;color:#fff;padding:6px 8px;text-align:center;font-weight:700;border:1px solid #bbb;}.rpt-table td{padding:5px 8px;border:1px solid #ddd;text-align:center;vertical-align:middle;}.rpt-table tr:nth-child(even) td{background:#f8f9fa;}.rpt-table .rpt-total td{background:#e8edf5;font-weight:800;border-top:2px solid #1e3a5f;}.rpt-table .num{text-align:right;}.rpt-table .rpt-good{color:#059669;font-weight:700;}.rpt-table .rpt-bad{color:#dc2626;font-weight:700;}.rpt-table .rpt-warn{color:#d97706;font-weight:700;}
.rpt-kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}.rpt-kpi-card{border:1px solid #bbb;border-top:3px solid #1e3a5f;padding:8px;text-align:center;border-radius:2px;}.rpt-kpi-card .rk-label{font-size:7.5pt;color:#555;margin-bottom:4px;}.rpt-kpi-card .rk-val{font-size:13pt;font-weight:900;color:#1e3a5f;line-height:1;}.rpt-kpi-card .rk-unit{font-size:7pt;color:#888;margin-top:2px;}
.rpt-sign{width:100%;border-collapse:collapse;margin-top:16px;}.rpt-sign td{border:1px solid #bbb;padding:5px 10px;font-size:8.5pt;text-align:center;}.rpt-sign .rpt-label{background:#f5f5f5;font-weight:700;width:70px;}.rpt-sign .sign-box{height:48px;vertical-align:bottom;padding-bottom:4px;}
.rpt-footer{margin-top:18px;border-top:1px solid #ccc;padding-top:6px;font-size:7.5pt;color:#888;text-align:center;}
@media print {
  .header,.filter-bar,.card-list,.panel-header .btn,.kpi-row,.fail-banner,.toast{display:none!important;}
  .layout{grid-template-columns:1fr;}
  .cert-panel{box-shadow:none;}
  .cert-doc{padding:12px;}
}
@media print{.rpt-toolbar{display:none!important;}.rpt-overlay{display:block!important;position:static;background:none;overflow:visible;}.rpt-page{width:100%;margin:0;box-shadow:none;padding:10mm 12mm;}body{background:#fff;}}
</style>
</head>
<body>

<div class="header">
  <h1>📄 품질 성적서 관리 <span style="font-size:.8rem;opacity:.7;font-weight:400;"> — PCB Manufacturing</span></h1>
  <button class="btn btn-report" onclick="openReport()">🖨 보고서 출력</button>
  <button class="btn btn-ghost" onclick="exportCSV()">📥 저장</button>
  <button class="btn btn-white" onclick="openModal()">+ 성적서 작성</button>
</div>

<div class="fail-banner" id="failBanner" style="display:none;"></div>

<div class="filter-bar">
  <input type="text" id="searchQ" placeholder="성적서번호·제품명·고객사 검색..." style="width:220px" oninput="renderList()">
  <select id="passFilter" onchange="renderList()">
    <option value="">전체</option><option value="합격">합격</option><option value="불합격">불합격</option>
  </select>
  <input type="month" id="monthFilter" onchange="renderList()">
</div>

<div class="layout">
  <div class="card-list" id="certList">
    <div class="list-header"><span>성적서 목록</span><span id="listCount" style="font-size:.75rem;color:var(--mute)"></span></div>
    <div id="listItems"></div>
  </div>
  <div class="cert-panel" id="certPanel">
    <div class="panel-header">
      <span class="panel-title">성적서 상세</span>
      <div style="display:flex;gap:6px">
        <button class="btn btn-outline" id="editBtn" style="display:none" onclick="openModal(currentId)">수정</button>
        <button class="btn btn-green" onclick="window.print()">🖨 인쇄</button>
      </div>
    </div>
    <div class="cert-doc" id="certDoc">
      <div style="text-align:center;padding:40px;color:var(--mute);font-size:.9rem">
        좌측 목록에서 성적서를 선택하세요
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modalTitle">성적서 작성</h2>
    <div class="form-row">
      <div class="form-group"><label>성적서 번호</label><input id="c-no" readonly placeholder="자동 생성"></div>
      <div class="form-group"><label>검사일</label><input type="date" id="c-date"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>고객사</label><input id="c-customer" placeholder="(주)삼성전자"></div>
      <div class="form-group"><label>수주번호</label><input id="c-poNo" placeholder="PO-2026-001"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>제품명/모델</label><input id="c-product" placeholder="PCB-A2401"></div>
      <div class="form-group"><label>층수</label><select id="c-layer"><option>단면</option><option>양면</option><option>4층</option><option>6층</option><option>8층</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>검사 수량 (매)</label><input type="number" id="c-qty" placeholder="100"></div>
      <div class="form-group"><label>샘플 수 (매)</label><input type="number" id="c-sample" placeholder="5"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>검사자</label><input id="c-inspector" placeholder="이품질"></div>
      <div class="form-group"><label>승인자</label><input id="c-approver" placeholder="박팀장"></div>
    </div>
    <div style="font-size:.8rem;font-weight:800;color:var(--sub);margin:12px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--teal)">외관 검사</div>
    <table class="inspect-input-table"><thead><tr><th>항목</th><th>기준</th><th>측정값</th><th>판정</th></tr></thead><tbody id="visual-rows"></tbody></table>
    <div style="font-size:.8rem;font-weight:800;color:var(--sub);margin:12px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--teal)">치수 검사</div>
    <table class="inspect-input-table"><thead><tr><th>항목</th><th>기준(mm)</th><th>측정값(mm)</th><th>판정</th></tr></thead><tbody id="dim-rows"></tbody></table>
    <div style="font-size:.8rem;font-weight:800;color:var(--sub);margin:12px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--teal)">전기 특성</div>
    <table class="inspect-input-table"><thead><tr><th>항목</th><th>기준</th><th>측정값</th><th>판정</th></tr></thead><tbody id="elec-rows"></tbody></table>
    <div class="form-group" style="margin-top:10px"><label>특이사항</label><textarea id="c-note" placeholder="검사 관련 특이사항..."></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-red" id="delBtn2" style="display:none" onclick="deleteItem()">삭제</button>
      <button class="btn btn-outline" onclick="closeModal()">취소</button>
      <button class="btn btn-blue" onclick="saveCert()">저장</button>
    </div>
  </div>
</div>

<div class="rpt-overlay" id="rptOverlay">
  <div class="rpt-toolbar">
    <span style="color:#fff;font-weight:700;font-size:.95rem">📄 품질 성적서 현황 보고서</span>
    <div style="display:flex;gap:8px">
      <button class="btn btn-white" onclick="window.print()">🖨 인쇄/PDF</button>
      <button class="btn btn-ghost" onclick="closeReport()">✕ 닫기</button>
    </div>
  </div>
  <div class="rpt-page" id="rptPage"></div>
</div>
<div class="kpi-row" id="kpiRow" style="padding:14px 28px 0;"></div>
<div class="toast" id="toast"></div>
<script>
const today=new Date().toISOString().slice(0,10);

const VISUAL_ITEMS=[
  {name:'외관 이물',spec:'이물 없음'},
  {name:'스크래치',spec:'0.1mm 이하'},
  {name:'솔더마스크 박리',spec:'없음'},
  {name:'동박 노출',spec:'없음'},
  {name:'실크인쇄 선명도',spec:'명확'},
];
const DIM_ITEMS=[
  {name:'기판 길이',spec:'규격±0.2'},
  {name:'기판 폭',spec:'규격±0.2'},
  {name:'기판 두께',spec:'규격±0.1'},
  {name:'드릴 홀경',spec:'규격±0.05'},
  {name:'랜드 폭',spec:'규격±0.05'},
];
const ELEC_ITEMS=[
  {name:'절연저항',spec:'≥100MΩ'},
  {name:'단락 검사',spec:'단락 없음'},
  {name:'개방 검사',spec:'개방 없음'},
  {name:'임피던스',spec:'규격±10%'},
];

function genSample(){
  const custs=['(주)삼성전자','LG이노텍','현대모비스','(주)코리아서킷'];
  const prds=['PCB-A2401','PCB-B1802','PCB-C3305','PCB-D0401'];
  const arr=[];
  const y=today.slice(0,4);
  const DIM_VALS=['200.05','150.02','1.61','0.30','0.25'];
  for(let i=0;i<10;i++){
    const d=String((i%28)+1).padStart(2,'0');
    const m=String(Math.floor(i/5)+5).padStart(2,'0');
    const pass=i%5!==0;
    const visual=VISUAL_ITEMS.map(x=>({...x,value:x.name==='외관 이물'&&!pass?'이물 발견':'정상',result:x.name==='외관 이물'&&!pass?'NG':'OK'}));
    const dim=DIM_ITEMS.map((x,idx)=>({...x,value:DIM_VALS[idx],result:'OK'}));
    const elec=ELEC_ITEMS.map(x=>({...x,value:x.name==='절연저항'?'150MΩ':x.name.includes('검사')?'이상없음':x.name==='임피던스'?'50Ω':'정상',result:'OK'}));
    arr.push({id:Date.now()+i,
      no:`QC-${y}${m}-${String(i+1).padStart(3,'0')}`,
      date:`${y}-${m}-${d}`,
      customer:custs[i%4],poNo:`PO-${y}-${String(i+1).padStart(3,'0')}`,
      product:prds[i%4],layer:['양면','4층','양면','6층'][i%4],
      qty:100+i*10,sample:5,
      inspector:'이품질',approver:'박팀장',
      visual,dim,elec,
      overall:pass?'합격':'불합격',note:'',
    });
  }
  return arr;
}

let certs;
try{ certs=JSON.parse(localStorage.getItem('pcbCerts')||'null')||genSample(); }
catch(e){ certs=genSample(); }
let currentId=null,editId=null,nextId=Date.now();

function save(){ localStorage.setItem('pcbCerts', JSON.stringify(certs)); }

let _toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>t.classList.remove('show'),2800);
}

function renderKPI(){
  const total=certs.length;
  const pass=certs.filter(c=>c.overall==='합격').length;
  const fail=certs.filter(c=>c.overall==='불합격').length;
  const thisMonth=today.slice(0,7);
  const monthCerts=certs.filter(c=>c.date.startsWith(thisMonth));
  const mPass=monthCerts.filter(c=>c.overall==='합격').length;
  const mRate=monthCerts.length?Math.round(mPass/monthCerts.length*100):0;
  const mColor=mRate>=95?'var(--green)':mRate>=80?'var(--amber)':'var(--red)';
  document.getElementById('kpiRow').innerHTML=`
    <div class="kpi" style="border-left-color:var(--teal)"><div class="kpi-l">총 성적서</div><div class="kpi-v" style="color:var(--teal)">${total}</div><div class="kpi-sub">건</div></div>
    <div class="kpi" style="border-left-color:var(--green)"><div class="kpi-l">합격</div><div class="kpi-v" style="color:var(--green)">${pass}</div><div class="kpi-sub">건</div></div>
    <div class="kpi" style="border-left-color:var(--red)"><div class="kpi-l">불합격</div><div class="kpi-v" style="color:var(--red)">${fail}</div><div class="kpi-sub">건</div></div>
    <div class="kpi" style="border-left-color:${mColor}"><div class="kpi-l">이번달 합격률</div><div class="kpi-v" style="color:${mColor}">${mRate}%</div><div class="kpi-sub">${monthCerts.length}건 중 ${mPass}건</div></div>`;
  renderMonthlyTrend();
}

function renderMonthlyTrend(){
  const monthMap={};
  certs.forEach(c=>{
    const k=c.date.slice(0,7);
    if(!monthMap[k]) monthMap[k]={pass:0,total:0};
    monthMap[k].total++;
    if(c.overall==='합격') monthMap[k].pass++;
  });
  const months=Object.keys(monthMap).sort();
  const html=months.map(m=>{
    const d=monthMap[m];
    const pct=d.total?Math.round(d.pass/d.total*100):0;
    const col=pct>=95?'var(--green)':pct>=80?'var(--amber)':'var(--red)';
    return `<div class="mt-row">
      <span class="mt-month">${m.slice(5)}월</span>
      <div class="mt-bar"><div class="mt-fill" style="width:${pct}%;background:${col}"></div></div>
      <span class="mt-pct" style="color:${col}">${pct}%</span>
    </div>`;
  }).join('');
  let wrap=document.getElementById('monthlyTrendWrap');
  if(!wrap){
    wrap=document.createElement('div');
    wrap.id='monthlyTrendWrap';
    wrap.className='monthly-trend-wrap';
    wrap.style.cssText='margin:0 28px 14px';
    document.getElementById('kpiRow').after(wrap);
  }
  wrap.innerHTML=`<div class="mt-title">📊 월별 합격률 추이</div>${html}`;
}

function renderFailBanner(){
  const el=document.getElementById('failBanner');
  const fails=certs.filter(c=>c.overall==='불합격');
  if(!fails.length){el.style.display='none';return;}
  el.style.display='flex';
  el.innerHTML='🚨 불합격 성적서 '+fails.length+'건: '+
    fails.slice(0,3).map(c=>`<span style="background:rgba(255,255,255,.2);padding:2px 8px;border-radius:4px">${c.product} (${c.customer})</span>`).join(' ')+
    (fails.length>3?` <span>외 ${fails.length-3}건</span>`:'');
}

function renderList(){
  const q=document.getElementById('searchQ').value.toLowerCase();
  const pf=document.getElementById('passFilter').value;
  const mf=document.getElementById('monthFilter').value;
  const list=certs.filter(c=>{
    const mq=!q||c.no.toLowerCase().includes(q)||c.product.toLowerCase().includes(q)||c.customer.includes(q);
    const mp=!pf||c.overall===pf;
    const mm=!mf||c.date.startsWith(mf);
    return mq&&mp&&mm;
  }).sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('listCount').textContent=`총 ${list.length}건`;
  document.getElementById('listItems').innerHTML=list.map(c=>`
    <div class="cert-item ${String(c.id)===String(currentId)?'selected':''}" onclick="selectCert('${c.id}')">
      <div class="ci-top">
        <span class="ci-no">${c.no}</span>
        <span class="pass-badge" style="background:${c.overall==='합격'?'#dcfce7':'#fee2e2'};color:${c.overall==='합격'?'var(--green)':'var(--red)'}">${c.overall}</span>
      </div>
      <div class="ci-product">${c.product}</div>
      <div class="ci-customer">${c.customer}</div>
      <div class="ci-meta"><span>${c.date}</span><span>${c.layer}</span><span>검사: ${c.inspector}</span></div>
    </div>`).join('');
  renderKPI();
  renderFailBanner();
}

function selectCert(id){
  currentId=id;
  document.getElementById('editBtn').style.display='block';
  const c=certs.find(x=>String(x.id)===String(id));
  if(!c)return;
  const infoLeft=`
    <div class="di-row"><div class="di-label">성적서 번호</div><div class="di-value">${c.no}</div></div>
    <div class="di-row"><div class="di-label">고객사</div><div class="di-value">${c.customer}</div></div>
    <div class="di-row"><div class="di-label">제품명/모델</div><div class="di-value">${c.product}</div></div>
    <div class="di-row"><div class="di-label">층수</div><div class="di-value">${c.layer}</div></div>`;
  const infoRight=`
    <div class="di-row"><div class="di-label">검사일</div><div class="di-value">${c.date}</div></div>
    <div class="di-row"><div class="di-label">수주번호</div><div class="di-value">${c.poNo}</div></div>
    <div class="di-row"><div class="di-label">검사 수량</div><div class="di-value">${c.qty.toLocaleString()} 매</div></div>
    <div class="di-row"><div class="di-label">샘플 수</div><div class="di-value">${c.sample} 매</div></div>`;
  const mkTable=(rows)=>`
    <table class="inspect-table">
      <thead><tr><th>검사 항목</th><th>판정 기준</th><th>측정값</th><th>판정</th></tr></thead>
      <tbody>${rows.map(r=>`
        <tr>
          <td style="text-align:left">${r.name}</td>
          <td>${r.spec}</td><td>${r.value}</td>
          <td class="${r.result==='OK'?'result-ok':'result-ng'}">${r.result==='OK'?'○ 합격':'✕ 불합격'}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
  const isPass=c.overall==='합격';
  document.getElementById('certDoc').innerHTML=`
    <div class="doc-title"><h2>PCB 검사 성적서</h2><p>PCB Manufacturing Co., Ltd.</p></div>
    <div class="doc-info-grid"><div>${infoLeft}</div><div>${infoRight}</div></div>
    <div class="section-title">1. 외관 검사</div>${mkTable(c.visual)}
    <div class="section-title">2. 치수 검사</div>${mkTable(c.dim)}
    <div class="section-title">3. 전기 특성</div>${mkTable(c.elec)}
    ${c.note?`<div class="section-title">4. 특이사항</div><div style="border:1px solid var(--border);padding:10px;border-radius:6px;font-size:.8rem">${c.note}</div>`:''}
    <div class="final-result" style="border-color:${isPass?'var(--green)':'var(--red)'};background:${isPass?'#f0fdf4':'#fef2f2'}">
      <div style="font-size:1.6rem;font-weight:900;color:${isPass?'var(--green)':'var(--red)'}">${isPass?'✓ 합 격':'✗ 불 합 격'}</div>
      <div style="font-size:.78rem;color:var(--sub);margin-top:4px">상기 제품은 당사 품질 기준을 ${isPass?'충족합니다':'충족하지 못합니다'}</div>
    </div>
    <div class="sign-row">
      <div class="sign-box">검사자<br><br>${c.inspector}</div>
      <div class="sign-box">승인자<br><br>${c.approver}</div>
    </div>`;
  renderList();
}

function buildInspectRows(tbodyId, items, data){
  document.getElementById(tbodyId).innerHTML=items.map((item,idx)=>`
    <tr>
      <td style="padding:5px 8px;font-size:.75rem">${item.name}</td>
      <td style="padding:5px 8px;font-size:.75rem;color:var(--mute)">${item.spec}</td>
      <td><input value="${data?data[idx]?.value||'':''}" placeholder="측정값 입력" id="${tbodyId}-v-${idx}"></td>
      <td>
        <select id="${tbodyId}-r-${idx}">
          <option value="OK" ${data&&data[idx]?.result==='OK'?'selected':''}>OK</option>
          <option value="NG" ${data&&data[idx]?.result==='NG'?'selected':''}>NG</option>
        </select>
      </td>
    </tr>`).join('');
}
function getInspectData(tbodyId, items){
  return items.map((item,idx)=>({
    ...item,
    value:document.getElementById(`${tbodyId}-v-${idx}`).value,
    result:document.getElementById(`${tbodyId}-r-${idx}`).value,
  }));
}

function openModal(id=null){
  editId=id;
  const c=id?certs.find(x=>String(x.id)===String(id)):null;
  document.getElementById('modalTitle').textContent=id?'성적서 수정':'성적서 작성';
  document.getElementById('delBtn2').style.display=id?'block':'none';
  const newNo=`QC-${today.slice(0,4)}${today.slice(5,7)}-${String(certs.length+1).padStart(3,'0')}`;
  document.getElementById('c-no').value=c?.no||newNo;
  document.getElementById('c-date').value=c?.date||today;
  document.getElementById('c-customer').value=c?.customer||'';
  document.getElementById('c-poNo').value=c?.poNo||'';
  document.getElementById('c-product').value=c?.product||'';
  document.getElementById('c-layer').value=c?.layer||'양면';
  document.getElementById('c-qty').value=c?.qty||'';
  document.getElementById('c-sample').value=c?.sample||'5';
  document.getElementById('c-inspector').value=c?.inspector||'';
  document.getElementById('c-approver').value=c?.approver||'';
  document.getElementById('c-note').value=c?.note||'';
  buildInspectRows('visual-rows',VISUAL_ITEMS,c?.visual);
  buildInspectRows('dim-rows',DIM_ITEMS,c?.dim);
  buildInspectRows('elec-rows',ELEC_ITEMS,c?.elec);
  document.getElementById('modal').classList.add('show');
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); editId=null; }

function saveCert(){
  const product=document.getElementById('c-product').value.trim();
  if(!product){showToast('제품명을 입력하세요');return;}
  const visual=getInspectData('visual-rows',VISUAL_ITEMS);
  const dim=getInspectData('dim-rows',DIM_ITEMS);
  const elec=getInspectData('elec-rows',ELEC_ITEMS);
  const allOK=[...visual,...dim,...elec].every(x=>x.result==='OK');
  const rec={id:editId||nextId++,
    no:document.getElementById('c-no').value,
    date:document.getElementById('c-date').value,
    customer:document.getElementById('c-customer').value,
    poNo:document.getElementById('c-poNo').value,
    product,
    layer:document.getElementById('c-layer').value,
    qty:parseInt(document.getElementById('c-qty').value)||0,
    sample:parseInt(document.getElementById('c-sample').value)||5,
    inspector:document.getElementById('c-inspector').value,
    approver:document.getElementById('c-approver').value,
    visual,dim,elec,
    overall:allOK?'합격':'불합격',
    note:document.getElementById('c-note').value,
  };
  if(editId){const i=certs.findIndex(x=>String(x.id)===String(editId));if(i>=0)certs[i]=rec;}
  else certs.push(rec);
  save(); closeModal();
  currentId=rec.id;
  renderList();
  selectCert(rec.id);
  showToast(`성적서 저장 완료. 판정: ${rec.overall}`);
}
function deleteItem(){
  if(!confirm('삭제하시겠습니까?'))return;
  certs=certs.filter(x=>String(x.id)!==String(editId));
  save(); closeModal(); currentId=null;
  document.getElementById('certDoc').innerHTML='<div style="text-align:center;padding:40px;color:var(--mute)">성적서를 선택하세요</div>';
  document.getElementById('editBtn').style.display='none';
  renderList();
}

function exportCSV(){
  const rows=['성적서번호,검사일,고객사,수주번호,제품명,층수,검사수량,검사자,승인자,판정'];
  certs.forEach(c=>rows.push(`${c.no},${c.date},${c.customer},${c.poNo},${c.product},${c.layer},${c.qty},${c.inspector},${c.approver},${c.overall}`));
  const blob=new Blob(['﻿'+rows.join('\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='품질성적서목록.csv';a.click();
}

function openReport(){
  const todayStr=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});
  const total=certs.length,passCnt=certs.filter(c=>c.overall==='합격').length,failCnt=certs.filter(c=>c.overall==='불합격').length;
  const ym=today.slice(0,7);const mCerts=certs.filter(c=>c.date.startsWith(ym));const mPass=mCerts.filter(c=>c.overall==='합격').length;
  const monthRate=mCerts.length>0?Math.round(mPass/mCerts.length*100):0;
  const rows=certs.map(c=>{const isPass=c.overall==='합격';return`<tr><td style="text-align:left;font-family:monospace;font-size:8pt">${c.no}</td><td>${c.date}</td><td style="text-align:left">${c.customer}</td><td style="text-align:left">${c.product}</td><td>${c.layer}</td><td class="num">${c.qty.toLocaleString()}</td><td>${c.inspector}</td><td>${c.approver}</td><td class="${isPass?'rpt-good':'rpt-bad'}">${c.overall}</td></tr>`;}).join('');
  document.getElementById('rptPage').innerHTML=`
    <div class="rpt-company"><strong>(주)PCB 제조</strong> | 품질관리<br>출력일: ${todayStr}</div>
    <div class="rpt-doc-title"><h1>품질 성적서 현황 보고서</h1><p>품질 검사 성적서 전체 현황 분석</p></div>
    <div class="rpt-kpi-grid">
      <div class="rpt-kpi-card"><div class="rk-label">총 성적서</div><div class="rk-val">${total}</div><div class="rk-unit">건</div></div>
      <div class="rpt-kpi-card"><div class="rk-label">합격</div><div class="rk-val" style="color:#059669">${passCnt}</div><div class="rk-unit">건</div></div>
      <div class="rpt-kpi-card"><div class="rk-label">불합격</div><div class="rk-val" style="color:#dc2626">${failCnt}</div><div class="rk-unit">건</div></div>
      <div class="rpt-kpi-card"><div class="rk-label">당월 합격률</div><div class="rk-val" style="color:${monthRate>=95?'#059669':monthRate>=80?'#d97706':'#dc2626'}">${monthRate}</div><div class="rk-unit">%</div></div>
    </div>
    <div class="rpt-sec"><div class="rpt-sec-title">■ 품질 성적서 목록</div>
      <table class="rpt-table"><thead><tr><th>성적서번호</th><th>검사일</th><th>고객사</th><th>제품명</th><th>층수</th><th>수량</th><th>검사자</th><th>승인자</th><th>판정</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
    <table class="rpt-sign"><tr><td class="rpt-label">작성</td><td class="sign-box"></td><td class="rpt-label">검토</td><td class="sign-box"></td><td class="rpt-label">승인</td><td class="sign-box"></td></tr></table>
    <div class="rpt-footer">본 보고서는 시스템에서 자동 생성되었습니다. | 출력: ${todayStr}</div>`;
  document.getElementById('rptOverlay').classList.add('show');
}
function closeReport(){document.getElementById('rptOverlay').classList.remove('show');}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const ov=document.getElementById('rptOverlay');if(ov.classList.contains('show')){closeReport();return;}closeModal();}});

renderList();
if(certs.length>0) selectCert(certs[0].id);
</script>
</body>
</html>

<!DOCTYPE html>
<!-- 생산 실적 관리 시스템 메인 HTML -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생산 실적 관리 | PCB 제조</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 상단 헤더: 시스템명 + 보고 마감 상태 + 주요 액션 -->
<header class="header">
  <div class="brand">
    <div class="brand-mark">PCB</div>
    <div class="brand-txt">
      <h1>생산 실적 관리</h1>
      <p>SMT 제조라인 · 생산관리팀</p>
    </div>
  </div>
  <div class="status-strip">
    <div class="st-item"><span class="st-label">현재 시각</span><span class="st-val mono" id="clock">--:--</span></div>
    <div class="st-item"><span class="st-label">보고 마감 09:00</span><span class="st-val" id="deadline">-</span></div>
    <div class="st-item"><span class="st-label">금일 입력</span><span class="st-val" id="todayInput">-</span></div>
  </div>
  <div class="hd-actions">
    <button class="btn btn-ghost" onclick="openReport()">🖨 보고서 출력</button>
    <button class="btn btn-ghost" onclick="exportCSV()">📥 Excel 저장</button>
    <button class="btn btn-primary" onclick="openModal()">＋ 실적 입력</button>
  </div>
</header>

<!-- 날짜 네비게이션 -->
<nav class="date-nav">
  <div class="month-nav">
    <button class="nav-btn" onclick="changeMonth(-1)" aria-label="이전 달">◀</button>
    <div class="current-date" id="currentDateLabel"></div>
    <button class="nav-btn" onclick="changeMonth(1)" aria-label="다음 달">▶</button>
  </div>
  <label class="date-field">조회일<input type="date" id="singleDate" onchange="renderAll()"></label>
  <div class="view-btns" role="tablist">
    <button class="vb active" id="vb-month" onclick="switchView('month',this)">월간</button>
    <button class="vb" id="vb-day" onclick="switchView('day',this)">일간</button>
  </div>
  <div class="period" id="periodLabel"></div>
</nav>

<!-- 미션 3: 불량률 경보 배너 -->
<div class="alert-banner" id="alertBanner" style="display:none;"></div>

<main class="layout">
  <!-- KPI -->
  <section class="kpi-row" id="kpiRow"></section>

  <!-- 미션 2: 라인별 실적 카드 (라인 현황판) -->
  <section>
    <div class="sec-head">
      <h2>라인 현황판</h2>
      <div class="legend">
        <span><i class="lamp good"></i>정상</span>
        <span><i class="lamp warn"></i>주의</span>
        <span><i class="lamp bad"></i>경보</span>
      </div>
    </div>
    <div class="line-cards" id="lineCards"></div>
  </section>

  <!-- 차트 -->
  <section class="mid-row">
    <div class="panel">
      <div class="panel-title"><h2>일별 생산량 추이</h2><span class="hint">생산량 · 계획량</span></div>
      <div class="chart-box"><canvas id="trendChart"></canvas></div>
    </div>
    <div class="panel">
      <div class="panel-title"><h2>라인별 양품률</h2><span class="hint">목표선 97.0%</span></div>
      <div class="chart-box"><canvas id="yieldChart"></canvas></div>
    </div>
  </section>

  <!-- 이력 테이블 -->
  <section class="panel">
    <div class="panel-title">
      <h2>생산 실적 이력 <span class="count" id="rowCount"></span></h2>
      <input type="search" id="tableSearch" class="search" placeholder="라인·제품명·작업자 검색" oninput="renderTable()">
    </div>
    <div class="table-wrap">
      <table class="data-table" id="recordTable"></table>
    </div>
  </section>
</main>

<!-- 입력 모달 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">생산 실적 입력</h2>
      <button class="x-btn" onclick="closeModal()" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body">
      <fieldset>
        <legend>기본 정보</legend>
        <div class="form-row">
          <div class="form-group"><label>날짜</label><input type="date" id="f-date"></div>
          <div class="form-group"><label>라인</label>
            <select id="f-line">
              <option>1호기</option><option>2호기</option><option>3호기</option><option>4호기</option><option>5호기</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>제품명/모델</label><input id="f-product" placeholder="예) PCB-A2401"></div>
          <div class="form-group"><label>층수</label>
            <select id="f-layer"><option>단면</option><option>양면</option><option>4층</option><option>6층</option><option>8층</option><option>기타</option></select>
          </div>
        </div>
      </fieldset>
      <fieldset>
        <legend>수량 <small>(단위: 매)</small></legend>
        <div class="form-row">
          <div class="form-group"><label>생산 지시량</label><input type="number" id="f-planned" placeholder="1000" oninput="calcRealtime()"></div>
          <div class="form-group"><label>생산량</label><input type="number" id="f-produced" placeholder="980" oninput="calcRealtime()"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>양품수</label><input type="number" id="f-good" placeholder="960" oninput="calcRealtime()"></div>
          <div class="form-group"><label>불량수</label><input type="number" id="f-defect" placeholder="20" oninput="autoFillGood();calcRealtime()"></div>
        </div>
        <!-- 미션 1: 실시간 양품률 계산 결과 -->
        <div class="realtime-calc" id="realtimeCalc"></div>
      </fieldset>
      <fieldset>
        <legend>작업 정보</legend>
        <div class="form-row">
          <div class="form-group"><label>작업자</label><input id="f-worker" placeholder="홍길동"></div>
          <div class="form-group"><label>비고</label><input id="f-note" placeholder="설비 정지, 자재 대기 등"></div>
        </div>
      </fieldset>
    </div>
    <div class="modal-footer">
      <button class="btn btn-red" id="delBtn" style="display:none" onclick="deleteRecord()">삭제</button>
      <span class="spacer"></span>
      <button class="btn btn-outline" onclick="closeModal()">취소</button>
      <button class="btn btn-blue" onclick="saveRecord()">저장</button>
    </div>
  </div>
</div>

<!-- 보고서 출력 오버레이 -->
<div class="rpt-overlay" id="rptOverlay">
  <div class="rpt-toolbar no-print">
    <span class="rpt-toolbar-title">생산 실적 보고서 미리보기</span>
    <div class="rpt-toolbar-btns">
      <button class="btn btn-primary" onclick="window.print()">🖨 인쇄 / PDF 저장</button>
      <button class="btn btn-ghost" onclick="closeReport()">✕ 닫기</button>
    </div>
  </div>
  <div class="rpt-page" id="rptPage"></div>
</div>

<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>

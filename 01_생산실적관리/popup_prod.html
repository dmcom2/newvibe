<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생산 실적 관리 | PCB 제조</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* 생산 실적 관리 시스템 스타일시트 */
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f0f4f8;--surface:#fff;--border:#d1d9e0;--border2:#c4cdd6;
  --text:#1a202c;--sub:#4a5568;--mute:#a0aec0;
  --blue:#2563eb;--green:#059669;--amber:#d97706;--red:#dc2626;--purple:#7c3aed;
  --rad:10px;--shadow:0 1px 3px rgba(0,0,0,.1),0 2px 8px rgba(0,0,0,.06);
}
body{font-family:'맑은 고딕','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ── 헤더 ── */
.header{background:linear-gradient(135deg,#1e3a5f,#2563eb 60%,#1d4ed8);color:#fff;padding:0 28px;height:58px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 10px rgba(0,0,0,.2);}
.header h1{font-size:1rem;font-weight:700;flex:1;}
.header h1 small{font-weight:400;opacity:.7;font-size:.8rem;margin-left:8px;}
.btn{padding:7px 16px;border:none;border-radius:7px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;}
.btn-white{background:#fff;color:var(--blue);}
.btn-white:hover{background:#f0f4ff;}
.btn-ghost{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);}
.btn-ghost:hover{background:rgba(255,255,255,.25);}
.btn-blue{background:var(--blue);color:#fff;}
.btn-outline{background:transparent;color:var(--sub);border:1px solid var(--border2);}
.btn-red{background:var(--red);color:#fff;}

/* ── 미션 3: 불량률 경보 배너 ── */
.alert-banner{background:linear-gradient(90deg,#dc2626,#b91c1c);color:#fff;padding:10px 28px;font-size:.85rem;font-weight:700;display:flex;align-items:center;gap:10px;animation:blink-bg 2s infinite;}
@keyframes blink-bg{0%,100%{opacity:1;}50%{opacity:.85;}}

/* ── 날짜 네비 ── */
.date-nav{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 28px;display:flex;align-items:center;gap:12px;}
.date-nav > button{padding:5px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;font-family:inherit;font-size:.85rem;transition:background .15s;}
.date-nav > button:hover{background:var(--bg);}
.current-date{font-size:.95rem;font-weight:700;min-width:110px;text-align:center;}
.date-nav input[type=date]{padding:5px 10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:.85rem;outline:none;background:var(--bg);}
.date-nav input[type=date]:focus{border-color:var(--blue);}
.view-btns{display:flex;gap:4px;margin-left:auto;}
.vb{padding:5px 14px;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-size:.8rem;cursor:pointer;font-family:inherit;color:var(--sub);transition:all .15s;}
.vb.active{background:var(--blue);color:#fff;border-color:var(--blue);}

/* ── 레이아웃 ── */
.layout{padding:18px 28px;display:flex;flex-direction:column;gap:14px;}

/* ── KPI 카드 ── */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.kpi::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;}
.kpi.k1::after{background:var(--blue);}
.kpi.k2::after{background:var(--green);}
.kpi.k3::after{background:var(--red);}
.kpi.k4::after{background:var(--amber);}
.kpi.k5::after{background:var(--purple);}
.kpi-l{font-size:.72rem;color:var(--mute);margin-bottom:4px;}
.kpi-v{font-size:1.5rem;font-weight:900;}
.kpi.k1 .kpi-v{color:var(--blue);}
.kpi.k2 .kpi-v{color:var(--green);}
.kpi.k3 .kpi-v{color:var(--red);}
.kpi.k4 .kpi-v{color:var(--amber);}
.kpi.k5 .kpi-v{color:var(--purple);}
.kpi-sub{font-size:.72rem;color:var(--mute);margin-top:3px;}

/* ── 미션 2: 라인별 실적 카드 ── */
.line-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;}
.lc{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);padding:13px 15px;box-shadow:var(--shadow);border-top-width:3px;}
.lc-name{font-size:.82rem;font-weight:800;margin-bottom:8px;}
.lc-main{font-size:1.3rem;font-weight:900;margin-bottom:4px;}
.lc-unit{font-size:.7rem;color:var(--mute);margin-bottom:8px;}
.lc-pills{display:flex;gap:5px;flex-wrap:wrap;}
.lc-pill{padding:2px 8px;border-radius:5px;font-size:.68rem;font-weight:700;}
.lc-pill.good{background:#dcfce7;color:#15803d;}
.lc-pill.warn{background:#fef3c7;color:#b45309;}
.lc-pill.bad{background:#fee2e2;color:#b91c1c;}

/* ── 차트 패널 ── */
.mid-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);padding:16px 18px;box-shadow:var(--shadow);}
.panel-title{font-size:.88rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.panel canvas{max-height:220px;}

/* ── 이력 테이블 ── */
.data-table{width:100%;border-collapse:collapse;font-size:.82rem;}
.data-table th{background:var(--bg);padding:9px 10px;text-align:left;font-weight:700;color:var(--sub);border-bottom:2px solid var(--border);white-space:nowrap;}
.data-table td{padding:9px 10px;border-bottom:1px solid var(--border);}
.data-table tr:hover td{background:#f8fafc;}
.data-table tr.row-alert td{background:#fff5f5;}
.data-table tr.row-alert:hover td{background:#fee2e2;}
.line-badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:.72rem;font-weight:700;color:#fff;}
.status-chip{padding:2px 8px;border-radius:5px;font-size:.72rem;font-weight:700;}
.chip-good{background:#dcfce7;color:#15803d;}
.chip-warn{background:#fef3c7;color:#b45309;}
.chip-bad{background:#fee2e2;color:#b91c1c;}
.edit-btn{padding:3px 8px;border:1px solid var(--border);border-radius:5px;cursor:pointer;font-size:.75rem;background:var(--bg);font-family:inherit;transition:background .15s;}
.edit-btn:hover{background:#dbeafe;border-color:var(--blue);color:var(--blue);}

/* ── 미션 1: 실시간 양품률 계산 영역 ── */
.realtime-calc{display:flex;gap:20px;align-items:center;padding:10px 14px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;margin:6px 0 10px;font-size:.83rem;min-height:36px;}
.realtime-calc:empty{display:none;}

/* ── 모달 ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface);border-radius:14px;padding:24px;width:460px;box-shadow:0 20px 50px rgba(0,0,0,.2);}
.modal h2{font-size:.95rem;font-weight:800;margin-bottom:16px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.form-group label{display:block;font-size:.75rem;font-weight:700;color:var(--sub);margin-bottom:3px;}
.form-group input,.form-group select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:.85rem;outline:none;background:var(--bg);color:var(--text);}
.form-group input:focus,.form-group select:focus{border-color:var(--blue);background:#fff;}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}

/* ── 토스트 ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);background:#1e293b;color:#f1f5f9;padding:10px 22px;border-radius:30px;font-size:.85rem;opacity:0;transition:all .3s;pointer-events:none;z-index:500;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.25);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── 보고서 출력 버튼 ── */
.btn-report{background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.4);}
.btn-report:hover{background:rgba(255,255,255,.32);}

/* ── 보고서 오버레이 ── */
.rpt-overlay{display:none;position:fixed;inset:0;z-index:200;background:#6b7280;overflow-y:auto;}
.rpt-overlay.show{display:block;}
.rpt-toolbar{position:sticky;top:0;z-index:10;background:#374151;padding:10px 28px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.3);}

/* ── 보고서 페이지 ── */
.rpt-page{width:210mm;min-height:297mm;margin:20px auto;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.25);padding:18mm 16mm 18mm 20mm;font-family:'맑은 고딕','Malgun Gothic','Segoe UI',sans-serif;font-size:9pt;color:#111;line-height:1.5;}
.rpt-company{text-align:right;font-size:8pt;color:#555;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:14px;}
.rpt-company strong{font-size:10pt;color:#111;}
.rpt-doc-title{text-align:center;margin-bottom:16px;}
.rpt-doc-title h1{font-size:16pt;font-weight:900;letter-spacing:2px;color:#111;margin-bottom:4px;}
.rpt-doc-title p{font-size:9pt;color:#555;}
.rpt-info-box{border:1px solid #bbb;border-collapse:collapse;width:100%;margin-bottom:16px;}
.rpt-info-box td{border:1px solid #bbb;padding:5px 10px;font-size:8.5pt;}
.rpt-info-box .rpt-label{background:#f5f5f5;font-weight:700;width:80px;color:#333;}
.rpt-sec{margin-bottom:14px;}
.rpt-sec-title{font-size:10pt;font-weight:900;background:#1e3a5f;color:#fff;padding:5px 10px;margin-bottom:8px;letter-spacing:.5px;}
.rpt-table{width:100%;border-collapse:collapse;font-size:8.5pt;margin-bottom:4px;}
.rpt-table th{background:#1e3a5f;color:#fff;padding:6px 8px;text-align:center;font-weight:700;border:1px solid #bbb;}
.rpt-table td{padding:5px 8px;border:1px solid #ddd;text-align:center;vertical-align:middle;}
.rpt-table tr:nth-child(even) td{background:#f8f9fa;}
.rpt-table .rpt-total td{background:#e8edf5;font-weight:800;border-top:2px solid #1e3a5f;}
.rpt-table .num{text-align:right;}
.rpt-table .rpt-good{color:#059669;font-weight:700;}
.rpt-table .rpt-bad{color:#dc2626;font-weight:700;}
.rpt-table .rpt-warn{color:#d97706;font-weight:700;}
.rpt-kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px;}
.rpt-kpi-card{border:1px solid #bbb;border-top:3px solid #1e3a5f;padding:8px;text-align:center;border-radius:2px;}
.rpt-kpi-card .rk-label{font-size:7.5pt;color:#555;margin-bottom:4px;}
.rpt-kpi-card .rk-val{font-size:13pt;font-weight:900;color:#1e3a5f;line-height:1;}
.rpt-kpi-card .rk-unit{font-size:7pt;color:#888;margin-top:2px;}
.rpt-sign{width:100%;border-collapse:collapse;margin-top:16px;}
.rpt-sign td{border:1px solid #bbb;padding:5px 10px;font-size:8.5pt;text-align:center;}
.rpt-sign .rpt-label{background:#f5f5f5;font-weight:700;width:70px;}
.rpt-sign .sign-box{height:48px;vertical-align:bottom;padding-bottom:4px;}
.rpt-footer{margin-top:18px;border-top:1px solid #ccc;padding-top:6px;font-size:7.5pt;color:#888;text-align:center;}

/* ── 인쇄 시 ── */
@media print{
  .no-print,.header,.date-nav,.layout,.rpt-toolbar{display:none!important;}
  .rpt-overlay{display:block!important;position:static;background:none;overflow:visible;}
  .rpt-page{width:100%;margin:0;box-shadow:none;padding:10mm 12mm;}
  body{background:#fff;}
}
</style>
</head>
<body>

<div class="header">
  <h1>📊 생산 실적 관리 <small>PCB Manufacturing</small></h1>
  <button class="btn btn-report" onclick="openReport()">🖨 보고서 출력</button>
  <button class="btn btn-ghost" onclick="exportCSV()">📥 Excel 저장</button>
  <button class="btn btn-white" onclick="openModal()">+ 실적 입력</button>
</div>

<!-- 미션 3: 불량률 경보 배너 -->
<div class="alert-banner" id="alertBanner" style="display:none;"></div>

<div class="date-nav">
  <button onclick="changeMonth(-1)">◀</button>
  <div class="current-date" id="currentDateLabel"></div>
  <button onclick="changeMonth(1)">▶</button>
  <input type="date" id="singleDate" onchange="renderAll()">
  <div class="view-btns">
    <button class="vb active" id="vb-month" onclick="switchView('month',this)">월간</button>
    <button class="vb" id="vb-day" onclick="switchView('day',this)">일간</button>
  </div>
</div>

<div class="layout">
  <!-- KPI -->
  <div class="kpi-row" id="kpiRow"></div>

  <!-- 미션 2: 라인별 실적 카드 -->
  <div class="line-cards" id="lineCards"></div>

  <!-- 차트 -->
  <div class="mid-row">
    <div class="panel">
      <div class="panel-title">📈 일별 생산량 추이</div>
      <canvas id="trendChart"></canvas>
    </div>
    <div class="panel">
      <div class="panel-title">🏭 라인별 양품률</div>
      <canvas id="yieldChart"></canvas>
    </div>
  </div>

  <!-- 이력 테이블 -->
  <div class="panel">
    <div class="panel-title" style="justify-content:space-between;">
      <span>📋 생산 실적 이력</span>
      <input type="text" id="tableSearch" placeholder="라인·제품명·작업자 검색..."
        style="padding:5px 10px;border:1px solid var(--border);border-radius:6px;font-size:.8rem;outline:none;width:220px;background:var(--bg);"
        oninput="renderTable()">
    </div>
    <table class="data-table" id="recordTable"></table>
  </div>
</div>

<!-- 입력 모달 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modalTitle">생산 실적 입력</h2>
    <div class="form-row">
      <div class="form-group"><label>날짜</label><input type="date" id="f-date"></div>
      <div class="form-group"><label>라인</label>
        <select id="f-line">
          <option>1호기</option><option>2호기</option><option>3호기</option><option>4호기</option><option>5호기</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>제품명/모델</label><input id="f-product" placeholder="예) PCB-A2401"></div>
      <div class="form-group"><label>층수</label>
        <select id="f-layer"><option>단면</option><option>양면</option><option>4층</option><option>6층</option><option>8층</option><option>기타</option></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>생산 지시량 (매)</label><input type="number" id="f-planned" placeholder="1000" oninput="calcRealtime()"></div>
      <div class="form-group"><label>생산량 (매)</label><input type="number" id="f-produced" placeholder="980" oninput="calcRealtime()"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>양품수 (매)</label><input type="number" id="f-good" placeholder="960" oninput="calcRealtime()"></div>
      <div class="form-group"><label>불량수 (매)</label><input type="number" id="f-defect" placeholder="20" oninput="autoFillGood();calcRealtime()"></div>
    </div>
    <!-- 미션 1: 실시간 양품률 계산 결과 -->
    <div class="realtime-calc" id="realtimeCalc"></div>
    <div class="form-row">
      <div class="form-group"><label>작업자</label><input id="f-worker" placeholder="홍길동"></div>
      <div class="form-group"><label>비고</label><input id="f-note" placeholder="특이사항"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-red" id="delBtn" style="display:none" onclick="deleteRecord()">삭제</button>
      <button class="btn btn-outline" onclick="closeModal()">취소</button>
      <button class="btn btn-blue" onclick="saveRecord()">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 보고서 출력 오버레이 -->
<div class="rpt-overlay" id="rptOverlay">
  <div class="rpt-toolbar no-print">
    <span style="font-size:.85rem;font-weight:700;color:#fff">생산 실적 보고서 미리보기</span>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-white" onclick="window.print()">🖨 인쇄 / PDF 저장</button>
      <button class="btn btn-ghost" onclick="closeReport()">✕ 닫기</button>
    </div>
  </div>
  <div class="rpt-page" id="rptPage"></div>
</div>

<script>
/* 생산 실적 관리 시스템 전체 로직 */

Chart.defaults.color = '#718096';
Chart.defaults.borderColor = '#e2e8f0';

const LINE_COLORS = {'1호기':'#2563eb','2호기':'#059669','3호기':'#d97706','4호기':'#7c3aed','5호기':'#dc2626'};

function makeId() { return Date.now() + Math.random(); }
const today = new Date().toISOString().slice(0, 10);
const Y = today.slice(0, 4), M = today.slice(5, 7);

function sampleData() {
  const records = [];
  const lines    = ['1호기', '2호기', '3호기', '4호기'];
  const products = ['PCB-A2401', 'PCB-B1802', 'PCB-C3305', 'PCB-D0401'];
  const layers   = ['양면', '4층', '양면', '6층'];
  for (let d = 1; d <= 25; d++) {
    const dd   = String(d).padStart(2, '0');
    const date = `${Y}-${M}-${dd}`;
    lines.forEach((line, i) => {
      const planned  = 800 + Math.floor(Math.random() * 400);
      const produced = planned - Math.floor(Math.random() * 30);
      const defect   = Math.floor(produced * (0.01 + Math.random() * 0.04));
      const good     = produced - defect;
      records.push({id:makeId(), date, line, product:products[i], layer:layers[i],
        planned, produced, good, defect, worker:'작업자'+(i+1), note:''});
    });
  }
  return records;
}

let records  = JSON.parse(localStorage.getItem('pcbProd') || 'null') || sampleData();
let nextId   = Date.now();
let editId   = null;
let currentYM = today.slice(0, 7);
let viewMode  = 'month';
let trendChart = null, yieldChart = null;

function save() { localStorage.setItem('pcbProd', JSON.stringify(records)); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

function updateDateLabel() {
  const [y, m] = currentYM.split('-');
  document.getElementById('currentDateLabel').textContent = `${y}년 ${m}월`;
}
function changeMonth(delta) {
  const d = new Date(currentYM + '-01');
  d.setMonth(d.getMonth() + delta);
  currentYM = d.toISOString().slice(0, 7);
  updateDateLabel(); renderAll();
}
function switchView(v, btn) {
  viewMode = v;
  document.querySelectorAll('.vb').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
}

function getRecords() {
  if (viewMode === 'month') return records.filter(r => r.date.startsWith(currentYM));
  const d = document.getElementById('singleDate').value || today;
  return records.filter(r => r.date === d);
}

function renderKPI() {
  const rs           = getRecords();
  const totalProduced = rs.reduce((s, r) => s + r.produced, 0);
  const totalGood     = rs.reduce((s, r) => s + r.good, 0);
  const totalDefect   = rs.reduce((s, r) => s + r.defect, 0);
  const totalPlanned  = rs.reduce((s, r) => s + r.planned, 0);
  const yieldRate     = totalProduced ? (totalGood / totalProduced * 100) : 0;
  const achRate       = totalPlanned  ? (totalProduced / totalPlanned * 100) : 0;
  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi k1"><div class="kpi-l">총 생산량</div><div class="kpi-v">${totalProduced.toLocaleString()}</div><div class="kpi-sub">매</div></div>
    <div class="kpi k2"><div class="kpi-l">총 양품수</div><div class="kpi-v">${totalGood.toLocaleString()}</div><div class="kpi-sub">매</div></div>
    <div class="kpi k3"><div class="kpi-l">총 불량수</div><div class="kpi-v">${totalDefect.toLocaleString()}</div><div class="kpi-sub">매</div></div>
    <div class="kpi k4"><div class="kpi-l">양품률</div><div class="kpi-v">${yieldRate.toFixed(2)}%</div><div class="kpi-sub">목표 97.0%</div></div>
    <div class="kpi k5"><div class="kpi-l">계획 달성률</div><div class="kpi-v">${achRate.toFixed(1)}%</div><div class="kpi-sub">목표 98.0%</div></div>`;
}

function renderLineCards() {
  const rs = getRecords();
  const byLine = {};
  rs.forEach(r => {
    if (!byLine[r.line]) byLine[r.line] = {produced:0, good:0, planned:0};
    byLine[r.line].produced += r.produced;
    byLine[r.line].good     += r.good;
    byLine[r.line].planned  += r.planned;
  });
  const lines = Object.keys(byLine);
  const el = document.getElementById('lineCards');
  if (!lines.length) { el.innerHTML = ''; return; }
  el.innerHTML = lines.map(line => {
    const d         = byLine[line];
    const yieldRate = d.produced ? (d.good / d.produced * 100) : 0;
    const achRate   = d.planned  ? (d.produced / d.planned * 100) : 0;
    const color     = LINE_COLORS[line] || '#64748b';
    const yClass    = yieldRate >= 97 ? 'good' : yieldRate >= 94 ? 'warn' : 'bad';
    const aClass    = achRate   >= 98 ? 'good' : achRate   >= 90 ? 'warn' : 'bad';
    return `<div class="lc" style="border-top-color:${color}">
      <div class="lc-name" style="color:${color}">${line}</div>
      <div class="lc-main">${d.produced.toLocaleString()}</div>
      <div class="lc-unit">생산량 (매)</div>
      <div class="lc-pills">
        <span class="lc-pill ${yClass}">양품률 ${yieldRate.toFixed(1)}%</span>
        <span class="lc-pill ${aClass}">달성률 ${achRate.toFixed(1)}%</span>
      </div>
    </div>`;
  }).join('');
}

function renderAlertBanner() {
  const rs = getRecords();
  const byLine = {};
  rs.forEach(r => {
    if (!byLine[r.line]) byLine[r.line] = {good:0, produced:0};
    byLine[r.line].good     += r.good;
    byLine[r.line].produced += r.produced;
  });
  const alerts = Object.keys(byLine)
    .map(line => ({line, rate: byLine[line].produced ? byLine[line].good / byLine[line].produced * 100 : 100}))
    .filter(a => a.rate < 97 && byLine[a.line].produced > 0)
    .sort((a, b) => a.rate - b.rate);

  const banner = document.getElementById('alertBanner');
  if (!alerts.length) { banner.style.display = 'none'; return; }
  banner.style.display = 'flex';
  banner.innerHTML = `⚠️ 불량률 경보 — 즉시 점검 필요:
    ${alerts.map(a => `<span style="background:rgba(255,255,255,.2);padding:2px 10px;border-radius:5px;">
      ${a.line} <strong>${a.rate.toFixed(2)}%</strong>
    </span>`).join('')}
    <span style="margin-left:auto;font-size:.78rem;font-weight:400;opacity:.85;">목표: 97.0% 이상</span>`;
}

function renderTrend() {
  if (trendChart) trendChart.destroy();
  const rs = getRecords();
  const byDate = {};
  rs.forEach(r => { byDate[r.date] = (byDate[r.date] || 0) + r.produced; });
  const labels = Object.keys(byDate).sort();
  const ctx = document.getElementById('trendChart').getContext('2d');
  trendChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels.map(d => d.slice(5)),
      datasets: [{label:'생산량', data:labels.map(d => byDate[d]),
        borderColor:'#2563eb', backgroundColor:'rgba(37,99,235,.1)',
        fill:true, tension:.3, pointRadius:3}]
    },
    options: {responsive:true, maintainAspectRatio:true,
      plugins: {legend:{display:false}},
      scales: {y:{ticks:{callback:v => v.toLocaleString()}}}}
  });
}

function renderYield() {
  if (yieldChart) yieldChart.destroy();
  const rs = getRecords();
  const byLine = {};
  rs.forEach(r => {
    if (!byLine[r.line]) byLine[r.line] = {good:0, produced:0};
    byLine[r.line].good     += r.good;
    byLine[r.line].produced += r.produced;
  });
  const lines  = Object.keys(byLine);
  const yields = lines.map(l => +(byLine[l].produced ? byLine[l].good / byLine[l].produced * 100 : 0).toFixed(2));
  const ctx = document.getElementById('yieldChart').getContext('2d');
  yieldChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: lines,
      datasets: [{label:'양품률(%)', data:yields,
        backgroundColor: lines.map(l => (LINE_COLORS[l] || '#64748b') + 'cc'),
        borderRadius: 6}]
    },
    options: {responsive:true, maintainAspectRatio:true,
      plugins: {legend:{display:false}},
      scales: {y:{min:90, max:100, ticks:{callback:v => v + '%'}}}}
  });
}

function renderTable() {
  const q  = document.getElementById('tableSearch').value.toLowerCase();
  const rs = getRecords().filter(r =>
    !q || r.line.includes(q) || r.product.toLowerCase().includes(q) || r.worker.includes(q)
  ).sort((a, b) => b.date.localeCompare(a.date));

  const yieldRate = r => r.produced ? (r.good / r.produced * 100) : 0;
  const chipClass = y => y >= 97 ? 'chip-good' : y >= 94 ? 'chip-warn' : 'chip-bad';

  document.getElementById('recordTable').innerHTML =
    `<thead><tr>
      <th>날짜</th><th>라인</th><th>제품명</th><th>층수</th>
      <th>계획</th><th>생산</th><th>양품</th><th>불량</th><th>양품률</th><th>작업자</th><th>편집</th>
    </tr></thead>
    <tbody>${rs.map(r => {
      const y = yieldRate(r);
      const rowClass = y < 97 ? 'row-alert' : '';
      return `<tr class="${rowClass}">
        <td>${r.date}</td>
        <td><span class="line-badge" style="background:${LINE_COLORS[r.line]||'#64748b'}">${r.line}</span></td>
        <td>${r.product}</td><td>${r.layer}</td>
        <td style="text-align:right">${r.planned.toLocaleString()}</td>
        <td style="text-align:right">${r.produced.toLocaleString()}</td>
        <td style="text-align:right;color:var(--green)">${r.good.toLocaleString()}</td>
        <td style="text-align:right;color:var(--red)">${r.defect.toLocaleString()}</td>
        <td><span class="status-chip ${chipClass(y)}">${y.toFixed(2)}%</span></td>
        <td>${r.worker}</td>
        <td><button class="edit-btn" onclick="editRecord(${r.id})">편집</button></td>
      </tr>`;
    }).join('')}</tbody>`;
}

function autoFillGood() {
  const produced = parseInt(document.getElementById('f-produced').value) || 0;
  const defect   = parseInt(document.getElementById('f-defect').value)   || 0;
  if (produced && defect) {
    const goodEl = document.getElementById('f-good');
    if (!goodEl.value || parseInt(goodEl.value) === produced - defect + 1) {
      goodEl.value = Math.max(0, produced - defect);
    }
  }
}

function calcRealtime() {
  const planned  = parseInt(document.getElementById('f-planned').value)  || 0;
  const produced = parseInt(document.getElementById('f-produced').value) || 0;
  const good     = parseInt(document.getElementById('f-good').value)     || 0;
  const calc     = document.getElementById('realtimeCalc');
  if (!calc) return;
  if (!produced) { calc.innerHTML = ''; return; }

  const yieldRate = (good / produced * 100);
  const achRate   = planned ? (produced / planned * 100) : 0;
  const yColor    = yieldRate >= 97 ? '#059669' : yieldRate >= 94 ? '#d97706' : '#dc2626';
  const aColor    = achRate   >= 98 ? '#059669' : achRate   >= 90 ? '#d97706' : '#dc2626';

  calc.innerHTML = `
    <span>📊 실시간 계산</span>
    <span>양품률: <strong style="color:${yColor};font-size:.95rem">${yieldRate.toFixed(2)}%</strong>
      <small style="color:var(--mute)">(목표 97%)</small></span>
    ${planned ? `<span>달성률: <strong style="color:${aColor};font-size:.95rem">${achRate.toFixed(1)}%</strong>
      <small style="color:var(--mute)">(목표 98%)</small></span>` : ''}
    <span style="color:var(--mute);font-size:.75rem">불량수: ${(produced - good).toLocaleString()}매</span>`;
}

function openModal(id = null) {
  editId = id;
  const r = id ? records.find(x => x.id === id) : null;
  document.getElementById('modalTitle').textContent = id ? '실적 수정' : '생산 실적 입력';
  document.getElementById('delBtn').style.display   = id ? 'block' : 'none';
  document.getElementById('f-date').value     = r?.date    || today;
  document.getElementById('f-line').value     = r?.line    || '1호기';
  document.getElementById('f-product').value  = r?.product || '';
  document.getElementById('f-layer').value    = r?.layer   || '양면';
  document.getElementById('f-planned').value  = r?.planned  || '';
  document.getElementById('f-produced').value = r?.produced || '';
  document.getElementById('f-good').value     = r?.good    || '';
  document.getElementById('f-defect').value   = r?.defect  || '';
  document.getElementById('f-worker').value   = r?.worker  || '';
  document.getElementById('f-note').value     = r?.note    || '';
  document.getElementById('realtimeCalc').innerHTML = '';
  if (r) calcRealtime();
  document.getElementById('modal').classList.add('show');
}
function editRecord(id) { openModal(id); }
function closeModal() { document.getElementById('modal').classList.remove('show'); editId = null; }

function saveRecord() {
  const product  = document.getElementById('f-product').value.trim();
  if (!product) { showToast('❌ 제품명을 입력하세요.'); return; }
  const planned  = parseInt(document.getElementById('f-planned').value)  || 0;
  const produced = parseInt(document.getElementById('f-produced').value) || 0;
  const good     = parseInt(document.getElementById('f-good').value)     || 0;
  const defect   = parseInt(document.getElementById('f-defect').value)   || 0;
  const rec = {
    id:      editId || nextId++,
    date:    document.getElementById('f-date').value,
    line:    document.getElementById('f-line').value,
    product,
    layer:   document.getElementById('f-layer').value,
    planned, produced, good, defect,
    worker:  document.getElementById('f-worker').value,
    note:    document.getElementById('f-note').value,
  };
  if (editId) {
    const i = records.findIndex(x => x.id === editId);
    if (i >= 0) records[i] = rec;
  } else {
    records.push(rec);
  }
  save(); closeModal(); renderAll();
  showToast(editId ? '✅ 실적이 수정되었습니다.' : '✅ 실적이 저장되었습니다.');
}

function deleteRecord() {
  if (!confirm('이 실적을 삭제하시겠습니까?')) return;
  records = records.filter(x => x.id !== editId);
  save(); closeModal(); renderAll();
  showToast('🗑 실적이 삭제되었습니다.');
}

function exportCSV() {
  const rs   = getRecords().sort((a, b) => a.date.localeCompare(b.date));
  const rows = ['날짜,라인,제품명,층수,계획량,생산량,양품수,불량수,양품률(%),작업자,비고'];
  rs.forEach(r => {
    const y = r.produced ? (r.good / r.produced * 100).toFixed(2) : '0.00';
    rows.push(`${r.date},${r.line},${r.product},${r.layer},${r.planned},${r.produced},${r.good},${r.defect},${y},${r.worker},${r.note}`);
  });
  const blob = new Blob(['﻿' + rows.join('\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `생산실적_${currentYM}.csv`;
  a.click();
  showToast('📥 CSV 파일을 내보냈습니다.');
}

function renderAll() {
  renderKPI();
  renderLineCards();
  renderAlertBanner();
  renderTrend();
  renderYield();
  renderTable();
}

  const [y, m] = currentYM.split('-');

    ? `${y}년 ${m}월 (${rs[0].date} ~ ${rs[rs.length-1].date})`

  const totalProduced = rs.reduce((s,r)=>s+r.produced,0);

}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('rptOverlay').classList.contains('show')) { closeReport(); return; }
  if (e.key === 'Escape' && document.getElementById('modal').classList.contains('show')) closeModal();
});

document.getElementById('singleDate').value = today;
updateDateLabel();
renderAll();
</script>
</body>

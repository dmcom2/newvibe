<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고객 클레임 관리 (8D) | PCB 제조</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f0f4f8;--surface:#fff;--border:#d1d9e0;
  --text:#1a202c;--sub:#4a5568;--mute:#a0aec0;
  --blue:#2563eb;--green:#059669;--amber:#d97706;--red:#dc2626;--slate:#475569;
  --rad:10px;--shadow:0 1px 3px rgba(0,0,0,.1),0 2px 8px rgba(0,0,0,.06);
}
body{font-family:'맑은 고딕','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.header{background:linear-gradient(135deg,#1e293b,#475569);color:#fff;padding:0 28px;height:58px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.header h1{font-size:1rem;font-weight:700;flex:1;}
.btn{padding:7px 16px;border:none;border-radius:7px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:hover{filter:brightness(.92);}
.btn-white{background:#fff;color:var(--slate);}
.btn-ghost{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);}
.btn-blue{background:var(--blue);color:#fff;}
.btn-outline{background:transparent;color:var(--sub);border:1px solid var(--border);}
.btn-red{background:var(--red);color:#fff;}

.filter-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.filter-bar input,.filter-bar select{padding:6px 10px;border:1px solid var(--border);border-radius:7px;font-size:.82rem;font-family:inherit;outline:none;}

.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px;}
.kpi{background:var(--surface);border-radius:var(--rad);padding:14px 16px;box-shadow:var(--shadow);border-top:3px solid transparent;}
.kpi-l{font-size:.72rem;color:var(--mute);margin-bottom:4px;}
.kpi-v{font-size:1.4rem;font-weight:900;}
.kpi-sub{font-size:.72rem;color:var(--mute);margin-top:3px;}

@keyframes blink-claim{0%,100%{opacity:1}50%{opacity:.88}}
.claim-alert-banner{padding:9px 28px;background:linear-gradient(90deg,#fee2e2,#fef2f2);border-bottom:2px solid #fca5a5;color:#7f1d1d;font-size:.8rem;font-weight:700;display:flex;align-items:center;gap:10px;animation:blink-claim 2s infinite;}
.claim-alert-banner span{background:#dc2626;color:#fff;padding:2px 8px;border-radius:10px;font-size:.72rem;}

.status-chart-wrap{background:var(--surface);border-radius:var(--rad);box-shadow:var(--shadow);padding:14px 20px;margin-bottom:14px;display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.sc-title{font-size:.78rem;font-weight:700;color:var(--sub);margin-bottom:8px;}
.sc-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.sc-bar-label{width:70px;font-size:.73rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sc-bar-track{flex:1;height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;}
.sc-bar-fill{height:100%;border-radius:4px;}
.sc-bar-cnt{width:24px;text-align:right;font-size:.72rem;font-weight:700;}

.sla-overdue{display:inline-block;background:#fef2f2;color:#dc2626;padding:1px 6px;border-radius:8px;font-size:.66rem;font-weight:700;border:1px solid #fca5a5;}
.sla-warn{display:inline-block;background:#fef3c7;color:#d97706;padding:1px 6px;border-radius:8px;font-size:.66rem;font-weight:700;border:1px solid #fcd34d;}

.claim-list{background:var(--surface);border-radius:var(--rad);box-shadow:var(--shadow);overflow:hidden;}
.claim-item{padding:14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;border-left:4px solid transparent;}
.claim-item:hover{background:#fafbfc;}
.claim-item.selected{background:#f8fafc;border-left-color:var(--slate);}
.ci-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.ci-no{font-size:.72rem;font-family:monospace;color:var(--mute);}
.ci-title{font-size:.88rem;font-weight:700;margin-bottom:2px;}
.ci-customer{font-size:.75rem;color:var(--sub);}
.ci-meta{display:flex;gap:8px;margin-top:5px;font-size:.7rem;color:var(--mute);}
.status-chip{padding:3px 8px;border-radius:12px;font-size:.72rem;font-weight:700;}
.sev-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;}

.report-panel{background:var(--surface);border-radius:var(--rad);box-shadow:var(--shadow);overflow:hidden;}
.report-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.d-step{margin-bottom:16px;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.d-step-header{padding:10px 14px;font-size:.82rem;font-weight:800;display:flex;align-items:center;gap:8px;}
.d-badge{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:900;color:#fff;flex-shrink:0;}
.d-body{padding:12px 14px;font-size:.82rem;line-height:1.7;color:var(--text);}
.d-body.empty{color:var(--mute);font-style:italic;}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:flex-start;justify-content:center;padding:30px 0;overflow-y:auto;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface);border-radius:14px;padding:24px;width:680px;box-shadow:0 20px 50px rgba(0,0,0,.2);}
.modal h2{font-size:.95rem;font-weight:800;margin-bottom:14px;}
.form-group{margin-bottom:10px;}
.form-group label{display:block;font-size:.75rem;font-weight:700;color:var(--sub);margin-bottom:3px;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:.85rem;outline:none;}
.form-group textarea{height:70px;resize:none;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
.section-label{font-size:.8rem;font-weight:800;color:var(--sub);margin:12px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--slate);}

.toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:10px 18px;border-radius:9px;font-size:.82rem;font-weight:600;z-index:999;opacity:0;pointer-events:none;transition:opacity .3s;}
.toast.show{opacity:1;}
@media print{.claim-alert-banner,.toast{display:none;}}
</style>
</head>
<body>

<div class="header">
  <h1>⚠ 고객 클레임 관리 (8D) <span style="font-size:.8rem;opacity:.7;font-weight:400;"> — PCB Manufacturing</span></h1>
  <button class="btn btn-ghost" onclick="exportCSV()">📥 저장</button>
  <button class="btn btn-white" onclick="openModal()">+ 클레임 등록</button>
</div>

<div class="claim-alert-banner" id="claimAlertBanner" style="display:none;"></div>

<div class="filter-bar">
  <input type="text" id="searchQ" placeholder="번호·고객·제품·내용 검색..." style="width:220px" oninput="render()">
  <select id="statusF" onchange="render()">
    <option value="">전체 상태</option>
    <option value="open">접수</option><option value="analysis">원인분석</option>
    <option value="action">대책수립</option><option value="verify">효과검증</option><option value="closed">완료</option>
  </select>
  <select id="sevF" onchange="render()">
    <option value="">전체 심각도</option>
    <option value="critical">긴급(Critical)</option><option value="major">중요(Major)</option><option value="minor">경미(Minor)</option>
  </select>
</div>

<div id="statusChart" style="padding:14px 28px 0"></div>

<div style="padding:18px 28px">
  <div class="kpi-row" id="kpiRow"></div>
  <div style="display:grid;grid-template-columns:360px 1fr;gap:14px">
    <div><div class="claim-list" id="claimList"></div></div>
    <div class="report-panel" id="reportPanel">
      <div class="report-header"><span style="font-size:.9rem;font-weight:700">8D 리포트</span></div>
      <div style="text-align:center;padding:40px;color:var(--mute)">좌측 목록에서 클레임을 선택하세요</div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modalTitle">클레임 등록</h2>
    <div class="form-row">
      <div class="form-group"><label>클레임 번호</label><input id="c-no" readonly></div>
      <div class="form-group"><label>접수일</label><input type="date" id="c-date"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>고객사</label><input id="c-customer" placeholder="(주)삼성전자"></div>
      <div class="form-group"><label>제품명</label><input id="c-product" placeholder="PCB-A2401"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>심각도</label>
        <select id="c-sev"><option value="critical">긴급(Critical)</option><option value="major">중요(Major)</option><option value="minor">경미(Minor)</option></select>
      </div>
      <div class="form-group"><label>상태</label>
        <select id="c-status"><option value="open">접수</option><option value="analysis">원인분석</option><option value="action">대책수립</option><option value="verify">효과검증</option><option value="closed">완료</option></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>클레임 수량</label><input type="number" id="c-qty" placeholder="50매"></div>
      <div class="form-group"><label>담당자</label><input id="c-manager" placeholder="박품질"></div>
    </div>
    <div class="section-label">8D 보고서 내용</div>
    <div class="form-group"><label>D1. 팀 구성</label><input id="d1" placeholder="품질팀장, 생산팀장, 공정엔지니어 등"></div>
    <div class="form-group"><label>D2. 문제 정의 (고객 클레임 내용)</label><textarea id="d2" placeholder="고객 접수 불만 내용을 구체적으로 기술..."></textarea></div>
    <div class="form-group"><label>D3. 긴급 봉쇄 조치 (임시 조치)</label><textarea id="d3" placeholder="즉각적인 임시 조치 사항..."></textarea></div>
    <div class="form-group"><label>D4. 근본 원인 분석 (5-Why, 특성요인도)</label><textarea id="d4" placeholder="Why1: ... → Why2: ... → Why3: ..."></textarea></div>
    <div class="form-group"><label>D5. 영구 시정 조치 계획</label><textarea id="d5" placeholder="근본 원인 해결을 위한 항구적 대책..."></textarea></div>
    <div class="form-group"><label>D6. 시정 조치 실시 및 검증</label><textarea id="d6" placeholder="조치 내용 및 효과 확인 결과..."></textarea></div>
    <div class="form-group"><label>D7. 재발 방지 대책 (수평전개)</label><textarea id="d7" placeholder="표준화, 유사 공정 적용, 교육 계획..."></textarea></div>
    <div class="form-group"><label>D8. 팀 공인 및 종결</label><input id="d8" placeholder="완료일, 검토자, 종결 승인"></div>
    <div class="modal-footer">
      <button class="btn btn-red" id="delBtn" style="display:none" onclick="deleteItem()">삭제</button>
      <button class="btn btn-outline" onclick="closeModal()">취소</button>
      <button class="btn btn-blue" onclick="saveItem()">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const today=new Date().toISOString().slice(0,10);

const STATUS_META={
  open:{label:'접수',color:'#64748b',bg:'#f1f5f9'},
  analysis:{label:'원인분석',color:'#2563eb',bg:'#dbeafe'},
  action:{label:'대책수립',color:'#d97706',bg:'#fef3c7'},
  verify:{label:'효과검증',color:'#7c3aed',bg:'#ede9fe'},
  closed:{label:'완료',color:'#059669',bg:'#dcfce7'},
};
const SEV_META={
  critical:{label:'긴급',color:'#dc2626',bg:'#fee2e2'},
  major:{label:'중요',color:'#d97706',bg:'#fef3c7'},
  minor:{label:'경미',color:'#64748b',bg:'#f1f5f9'},
};
const D_COLORS=['#64748b','#2563eb','#dc2626','#7c3aed','#d97706','#059669','#0891b2','#475569'];
const SLA_DAYS={critical:5,major:10,minor:20};

let claims=JSON.parse(localStorage.getItem('pcbClaims')||'null')||genSample();
let selectedId=null,editId=null,nextId=Date.now();

function genSample(){
  const custs=['(주)삼성전자','LG이노텍','현대모비스','(주)코리아서킷'];
  const prds=['PCB-A2401','PCB-B1802','PCB-C3305','PCB-D0401'];
  const issues=['단락(Short) 발생','외관 스크래치','솔더마스크 박리','치수 불량','드릴홀 위치 편차','절연저항 불량'];
  const sts=Object.keys(STATUS_META);
  const sevs=['critical','major','major','minor','minor'];
  return Array.from({length:10},(_,i)=>{
    const d=String((i%20)+1).padStart(2,'0');
    const m=String(Math.floor(i/5)+4).padStart(2,'0');
    return {id:Date.now()+i,
      no:`8D-${today.slice(0,4)}${m}-${String(i+1).padStart(3,'0')}`,
      date:`${today.slice(0,4)}-${m}-${d}`,
      customer:custs[i%4],product:prds[i%4],
      sev:sevs[i%5],status:sts[i%5],
      qty:10+i*5,manager:'박품질',
      d1:'품질팀장, 생산팀장, 공정엔지니어',
      d2:`${issues[i%6]}으로 인한 고객 클레임 접수. 수량: ${10+i*5}매, 불량률 ${(1+i*0.2).toFixed(1)}%`,
      d3:'불량 LOT 전수 출하 중단 및 재검사 실시',
      d4:`Why1: ${issues[i%6]} 발생 → Why2: 공정 파라미터 이탈 → Why3: 설비 노후화`,
      d5:'설비 정기 점검 주기 단축, 공정 파라미터 관리 기준 강화',
      d6:i<5?'조치 완료 후 샘플 검사 결과 이상 없음':'진행 중',
      d7:'유사 공정 전체 파라미터 재검토 및 작업 표준서 개정',
      d8:sts[i%5]==='closed'?`${today.slice(0,4)}-${m}-${String(parseInt(d)+5).padStart(2,'0')} 종결 완료`:'',
    };
  });
}
function save(){localStorage.setItem('pcbClaims',JSON.stringify(claims));}

function showToast(msg){
  const t=document.getElementById('toast');
  clearTimeout(t._tid);t.textContent=msg;t.classList.add('show');
  t._tid=setTimeout(()=>t.classList.remove('show'),2800);
}

function getSlaStatus(c){
  if(c.status==='closed') return null;
  const elapsed=Math.ceil((new Date(today)-new Date(c.date))/86400000);
  const limit=SLA_DAYS[c.sev];
  const left=limit-elapsed;
  if(left<0) return {type:'overdue',daysOver:-left};
  if(left<=2) return {type:'warn',daysLeft:left};
  return null;
}

function renderKPI(){
  const open=claims.filter(c=>c.status==='open').length;
  const critical=claims.filter(c=>c.sev==='critical'&&c.status!=='closed').length;
  const closed=claims.filter(c=>c.status==='closed').length;
  const total=claims.length;
  const avgDays=closed?Math.round(claims.filter(c=>c.status==='closed').reduce((s,c)=>{
    const d=c.d8?.slice(0,10);if(!d)return s;
    return s+Math.max(0,Math.ceil((new Date(d)-new Date(c.date))/86400000));
  },0)/closed):0;
  document.getElementById('kpiRow').innerHTML=`
    <div class="kpi" style="border-top-color:var(--slate)"><div class="kpi-l">전체 클레임</div><div class="kpi-v" style="color:var(--slate)">${total}</div><div class="kpi-sub">건</div></div>
    <div class="kpi" style="border-top-color:var(--red)"><div class="kpi-l">긴급 미결</div><div class="kpi-v" style="color:var(--red)">${critical}</div><div class="kpi-sub">건</div></div>
    <div class="kpi" style="border-top-color:var(--amber)"><div class="kpi-l">처리중</div><div class="kpi-v" style="color:var(--amber)">${open}</div><div class="kpi-sub">건</div></div>
    <div class="kpi" style="border-top-color:var(--green)"><div class="kpi-l">처리 완료</div><div class="kpi-v" style="color:var(--green)">${closed}</div><div class="kpi-sub">건</div></div>
    <div class="kpi" style="border-top-color:var(--blue)"><div class="kpi-l">평균 처리일</div><div class="kpi-v" style="color:var(--blue)">${avgDays}</div><div class="kpi-sub">일</div></div>`;
}

function renderAlertBanner(){
  const criticals=claims.filter(c=>c.sev==='critical'&&c.status!=='closed');
  const overdue=claims.filter(c=>c.status!=='closed'&&getSlaStatus(c)?.type==='overdue');
  const banner=document.getElementById('claimAlertBanner');
  if(criticals.length===0&&overdue.length===0){banner.style.display='none';return;}
  const parts=[];
  if(criticals.length>0) parts.push(`<span>긴급</span> ${criticals.length}건의 Critical 클레임이 미결입니다.`);
  if(overdue.length>0) parts.push(`<span>기한초과</span> ${overdue.length}건이 SLA 처리 기한을 초과했습니다.`);
  banner.innerHTML='🚨 '+parts.join(' &nbsp;|&nbsp; ');
  banner.style.display='flex';
}

function renderStatusChart(){
  const total=claims.length||1;
  const statusBars=Object.entries(STATUS_META).map(([k,v])=>{
    const cnt=claims.filter(c=>c.status===k).length;
    const pct=Math.round(cnt/total*100);
    return `<div class="sc-bar-row"><span class="sc-bar-label">${v.label}</span><div class="sc-bar-track"><div class="sc-bar-fill" style="width:${pct}%;background:${v.color}"></div></div><span class="sc-bar-cnt" style="color:${v.color}">${cnt}</span></div>`;
  }).join('');
  const sevBars=Object.entries(SEV_META).map(([k,v])=>{
    const cnt=claims.filter(c=>c.sev===k).length;
    const pct=Math.round(cnt/total*100);
    return `<div class="sc-bar-row"><span class="sc-bar-label">${v.label}</span><div class="sc-bar-track"><div class="sc-bar-fill" style="width:${pct}%;background:${v.color}"></div></div><span class="sc-bar-cnt" style="color:${v.color}">${cnt}</span></div>`;
  }).join('');
  document.getElementById('statusChart').innerHTML=`
    <div class="status-chart-wrap">
      <div><div class="sc-title">처리 상태별 현황</div>${statusBars}</div>
      <div><div class="sc-title">심각도별 현황</div>${sevBars}</div>
    </div>`;
}

function getFiltered(){
  const q=document.getElementById('searchQ').value.toLowerCase();
  const s=document.getElementById('statusF').value;
  const sev=document.getElementById('sevF').value;
  return claims.filter(c=>{
    const mq=!q||c.no.toLowerCase().includes(q)||c.customer.includes(q)||c.product.toLowerCase().includes(q)||c.d2?.includes(q);
    return mq&&(!s||c.status===s)&&(!sev||c.sev===sev);
  }).sort((a,b)=>{
    const so={critical:0,major:1,minor:2};
    if(so[a.sev]!==so[b.sev]) return so[a.sev]-so[b.sev];
    return b.date.localeCompare(a.date);
  });
}

function render(){
  renderKPI();renderAlertBanner();renderStatusChart();
  const list=getFiltered();
  document.getElementById('claimList').innerHTML=list.map(c=>{
    const sm=STATUS_META[c.status];const sev=SEV_META[c.sev];
    const sla=getSlaStatus(c);
    const slaBadge=sla?.type==='overdue'?`<span class="sla-overdue">기한+${sla.daysOver}일</span>`:
                    sla?.type==='warn'?`<span class="sla-warn">D-${sla.daysLeft}</span>`:'';
    return `<div class="claim-item ${String(c.id)===String(selectedId)?'selected':''}" onclick="selectClaim('${c.id}')">
      <div class="ci-header"><span class="ci-no">${c.no}</span><span class="status-chip" style="background:${sm.bg};color:${sm.color}">${sm.label}</span></div>
      <div class="ci-title">${c.d2?.slice(0,35)||'(내용없음)'}${(c.d2?.length||0)>35?'...':''}</div>
      <div class="ci-customer">${c.customer} | ${c.product}</div>
      <div class="ci-meta">
        <span><span class="sev-dot" style="background:${sev.color}"></span>${sev.label}</span>
        <span>${c.date}</span><span>${c.manager}</span>${slaBadge}
      </div>
    </div>`;
  }).join('')||'<div style="text-align:center;padding:30px;color:var(--mute)">검색 결과 없음</div>';
}

function selectClaim(id){
  selectedId=id;const c=claims.find(x=>String(x.id)===String(id));if(!c)return;
  const sm=STATUS_META[c.status];const sev=SEV_META[c.sev];
  const steps=[
    {d:'D1',title:'팀 구성',content:c.d1},{d:'D2',title:'문제 정의',content:c.d2},
    {d:'D3',title:'긴급 봉쇄 조치',content:c.d3},{d:'D4',title:'근본 원인 분석',content:c.d4},
    {d:'D5',title:'영구 시정 조치 계획',content:c.d5},{d:'D6',title:'시정 조치 실시 및 검증',content:c.d6},
    {d:'D7',title:'재발 방지 대책',content:c.d7},{d:'D8',title:'팀 공인 및 종결',content:c.d8},
  ];
  document.getElementById('reportPanel').innerHTML=`
    <div class="report-header">
      <div>
        <div style="font-size:.78rem;color:var(--mute)">${c.no} | ${c.date}</div>
        <div style="font-size:.95rem;font-weight:800">${c.customer} — ${c.product}</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <span class="status-chip" style="background:${sev.bg};color:${sev.color}">${sev.label}</span>
        <span class="status-chip" style="background:${sm.bg};color:${sm.color}">${sm.label}</span>
        <button class="btn btn-outline" style="font-size:.75rem;padding:4px 10px" onclick="openModal('${c.id}')">수정</button>
        <button class="btn" style="font-size:.75rem;padding:4px 10px;background:var(--slate);color:#fff" onclick="window.print()">🖨</button>
      </div>
    </div>
    <div style="padding:16px 20px">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;background:var(--bg);border-radius:8px;padding:12px">
        <div><div style="font-size:.7rem;color:var(--mute)">클레임 수량</div><div style="font-weight:700">${c.qty} 매</div></div>
        <div><div style="font-size:.7rem;color:var(--mute)">담당자</div><div style="font-weight:700">${c.manager}</div></div>
        <div><div style="font-size:.7rem;color:var(--mute)">접수일</div><div style="font-weight:700">${c.date}</div></div>
      </div>
      ${steps.map((s,i)=>`
        <div class="d-step">
          <div class="d-step-header" style="background:${D_COLORS[i]}15">
            <div class="d-badge" style="background:${D_COLORS[i]}">${s.d}</div>
            <span style="color:${D_COLORS[i]}">${s.title}</span>
          </div>
          <div class="d-body ${s.content?'':'empty'}">${s.content||'미입력'}</div>
        </div>`).join('')}
    </div>`;
  render();
}

function openModal(id=null){
  editId=id;const c=id?claims.find(x=>String(x.id)===String(id)):null;
  document.getElementById('modalTitle').textContent=id?'클레임 수정':'클레임 등록';
  document.getElementById('delBtn').style.display=id?'block':'none';
  const newNo=`8D-${today.slice(0,4)}${today.slice(5,7)}-${String(claims.length+1).padStart(3,'0')}`;
  document.getElementById('c-no').value=c?.no||newNo;
  document.getElementById('c-date').value=c?.date||today;
  document.getElementById('c-customer').value=c?.customer||'';
  document.getElementById('c-product').value=c?.product||'';
  document.getElementById('c-sev').value=c?.sev||'major';
  document.getElementById('c-status').value=c?.status||'open';
  document.getElementById('c-qty').value=c?.qty||'';
  document.getElementById('c-manager').value=c?.manager||'';
  ['d1','d2','d3','d4','d5','d6','d7','d8'].forEach(k=>{document.getElementById(k).value=c?.[k]||'';});
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');editId=null;}

function saveItem(){
  const customer=document.getElementById('c-customer').value.trim();
  if(!customer){showToast('고객사를 입력하세요.');return;}
  const rec={id:editId||nextId++,
    no:document.getElementById('c-no').value,date:document.getElementById('c-date').value,
    customer,product:document.getElementById('c-product').value,
    sev:document.getElementById('c-sev').value,status:document.getElementById('c-status').value,
    qty:parseInt(document.getElementById('c-qty').value)||0,manager:document.getElementById('c-manager').value,
    d1:document.getElementById('d1').value,d2:document.getElementById('d2').value,
    d3:document.getElementById('d3').value,d4:document.getElementById('d4').value,
    d5:document.getElementById('d5').value,d6:document.getElementById('d6').value,
    d7:document.getElementById('d7').value,d8:document.getElementById('d8').value,
  };
  if(editId){const i=claims.findIndex(x=>String(x.id)===String(editId));if(i>=0)claims[i]=rec;}
  else claims.push(rec);
  save();closeModal();selectedId=rec.id;render();selectClaim(rec.id);
  showToast('클레임이 저장되었습니다.');
}
function deleteItem(){
  if(!confirm('삭제하시겠습니까?'))return;
  claims=claims.filter(x=>String(x.id)!==String(editId));
  save();closeModal();selectedId=null;
  document.getElementById('reportPanel').innerHTML='<div style="text-align:center;padding:40px;color:var(--mute)">클레임을 선택하세요</div>';
  render();
}
function exportCSV(){
  const rows=['번호,접수일,고객사,제품,심각도,상태,수량,담당자,D2문제,D4원인,D7재발방지'];
  claims.forEach(c=>rows.push(`${c.no},${c.date},${c.customer},${c.product},${SEV_META[c.sev]?.label},${STATUS_META[c.status]?.label},${c.qty},${c.manager},"${c.d2||''}","${c.d4||''}","${c.d7||''}"`));
  const blob=new Blob(['﻿'+rows.join('\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='클레임현황.csv';a.click();
}

render();
if(claims.length>0) selectClaim(claims[0].id);
</script>
</body>
</html>
